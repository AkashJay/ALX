[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equiprag-system2"
version = "0.1.0"
description = "EquipRAG System 2: serverless Azure data engineering pipeline"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6,<7",
  "pydantic>=2,<3",
  "jsonschema>=4,<5",
]

[project.optional-dependencies]
inference = ["openai>=1,<4"]
azure = ["openai>=1,<4", "azure-identity>=1,<2"]
databricks = ["pyspark>=3.5,<5", "databricks-sdk>=0.40"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "build>=1,<2", "mypy>=1,<2", "setuptools>=69", "wheel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[project.scripts]
equiprag-local = "equiprag_system2.local:main"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
follow_untyped_imports = true
